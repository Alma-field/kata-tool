</p> </section> </main> <script>(function(){const target = "/treasure_hunting/drift_island/";
const fallbackHref = "../";
const baseUrl = "/kata-tool/";

      const messageElement = document.getElementById('redirect-message');
      const linkElement = document.getElementById('redirect-link');

      const decodeTarget = (value) => {
        try {
          return decodeURIComponent(value);
        } catch {
          return value;
        }
      };

      const resolveTarget = (value) => {
        const decoded = decodeTarget(value).trim();

        if (!decoded) {
          return '';
        }

        if (/^https?:\/\//i.test(decoded)) {
          return decoded;
        }

        const normalizeBasePath = (basePath) => {
          if (!basePath || basePath === '/') {
            return '/';
          }

          return `/${basePath.replace(/^\/+|\/+$/g, '')}/`;
        };

        const resolveBaseAwarePath = (pathValue) => {
          const normalizedPath = `/${pathValue.replace(/^\/+/, '')}`;
          const normalizedBase = normalizeBasePath(baseUrl);

          if (normalizedBase === '/' || normalizedPath.startsWith(normalizedBase)) {
            return normalizedPath;
          }

          return `${normalizedBase.replace(/\/$/, '')}${normalizedPath}`;
        };

        if (decoded.startsWith('/')) {
          return new URL(resolveBaseAwarePath(decoded), window.location.origin).href;
        }

        const currentPath = window.location.pathname.replace(/\/+$/, '/');
        const normalizedPath = decoded.replace(/^\/+/, '');

        if (!normalizedPath) {
          return '';
        }

        return new URL(normalizedPath, `${window.location.origin}${currentPath}`).href;
      };

      const targetHref = resolveTarget(target);

      if (targetHref) {
        if (linkElement) {
          linkElement.setAttribute('href', targetHref);
          linkElement.textContent = targetHref;
        }

        if (messageElement) {
          messageElement.textContent = '自動で移動します。';
        }

        window.location.replace(targetHref);
      } else {
        if (messageElement) {
          messageElement.textContent = '移動先が指定されていません。';
        }

        if (linkElement) {
          linkElement.setAttribute('href', fallbackHref);
        }
      }
    })();</script> </body> </html>
